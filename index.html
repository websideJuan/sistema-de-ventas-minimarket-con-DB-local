<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sistema de inventario</title>
    <link rel="stylesheet" href="main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <nav class="py-4 bg-cyan-900 text-white">
      <div class="flex justify-between container mx-auto">
        <a href="#">LOGOTIPO</a>
        <button>
          <i class="fa-solid fa-gear"></i>
          <a href="#">Settings</a>
        </button>
      </div>
    </nav>
    <header class="bg-white">
      <div class="container mx-auto mt-3">
        <button
          class="relative hover:underline py-3 px-6 bg-indigo-600 text-white text-xl uppercase cursor-pointer"
          id="initDailySale"
        >
          Iniciar ventas
        </button>
      </div>
      <div class="flex justify-between items-center container mx-auto">
        <div class="flex gap-8">
          <div>
            <button class="cursor-pointer hover:underline" id="addToProduct">
              Producto
            </button>
          </div>
          <div>
            <button class="cursor-pointer hover:underline" id="invoices">
              Facturas
            </button>
          </div>
          <div>
            <button class="cursor-pointer hover:underline" id="dailySales">
              Ventas
            </button>
          </div>
          <div>
            <button class="cursor-pointer hover:underline" data-modal="false">
              Estadisticas
            </button>
          </div>
        </div>
        <ul class="flex gap-4 py-3">
          <li>
            <div
              class="bg-red-700 text-white relative px-4 py-2 rounded shadow cursor-pointer"
            >
              <span
                class="absolute -top-3 -right-3 bg-white text-black px-2 rounded-full"
                >2</span
              >
              Bajo Stock
            </div>
          </li>
          <li>
            <div
              class="bg-yellow-700 text-white relative px-4 py-2 rounded shadow cursor-pointer"
            >
              <span
                class="absolute -top-3 -right-3 bg-white text-black px-2 rounded-full"
                >2</span
              >
              Medio Stock
            </div>
          </li>
          <li>
            <div
              class="bg-green-700 text-white relative px-4 py-2 rounded shadow cursor-pointer"
            >
              <span
                class="absolute -top-3 -right-3 bg-white text-black px-2 rounded-full"
                >2</span
              >
              Disponibles Stock
            </div>
          </li>
          <li>
            <div
              class="bg-blue-700 text-white relative px-4 py-2 rounded shadow cursor-pointer"
            >
              <span
                class="absolute -top-3 -right-3 bg-white text-black px-2 rounded-full"
                >2</span
              >
              Pedidos y compras
            </div>
          </li>
        </ul>
      </div>
    </header>
    <main class="flex container mx-auto">
      <div class="pe-4 py-4">
        <h2 class="block mb-3 uppercase text-xs text-gray-400 font-bold">
          Productos
        </h2>

        <div id="cartHead" class="flex justify-between mb-3">
          <button 
              data-id="deleteElemets" 
              class="text-gray-700 cursor-pointer">
            Eliminar elementos
          </button>

          <div>
            <button 
              class="p-2 rounded-sm hover:bg-red-600 hover:text-white cursor-pointer transition-all" 
              id="deleteElemetSelect">
              <i class="fa-regular fa-trash-can"></i>
            </button>
            <input
              type="checkbox"
              name="checkDeletAll"
              id="checkDeletAll"
              class="hidden"
            />
          </div>
        </div>

        <ul
          id="listCartProducts"
          class="min-w-xl h-full flex flex-col gap-4 border-b border-gray-400"
        ></ul>

        <div id="cartFooter"></div>
      </div>

      <div class="flex flex-col w-full border-s border-gray-300 ps-4 py-4">
        <div
          class="flex border border-gray-200 bg-white hover:border-indigo-600 rounded-xl"
        >
          <button class="px-4 text-gray-200">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <input
            type="text"
            class="py-2 w-full focus:outline-0"
            name="searchProduct"
            id="searchProduct"
            aria-describedby="helpId"
            placeholder="Buscar por nombre, Ej: Tomates, Papas, etc..."
          />
        </div>
        <ul id="renderProductsList" class="flex flex-wrap gap-4 py-4"></ul>
      </div>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
