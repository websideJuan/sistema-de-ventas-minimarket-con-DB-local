<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de inventario / Crea tu inventario</title>
    <link rel="stylesheet" href="main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 relative">
    <nav class="text-white lg:absolute w-full border-b border-gray-300">
      <div class="container mx-auto px-6 lg:px-0">
        <div
          class="flex justify-between items-center py-6 relative z-10 relative"
        >
          <a href="#" class="text-3xl/7 lg:text-4xl/7 font-bold text-cyan-900">
            Inventory
          </a>
        </div>
      </div>
    </nav>
    <main class="min-h-screen lg:flex lg:items-center lg:justify-center">
      <div
        class="px-6 py-8 flex flex-col gap-6 lg:px-8 lg:flex-row lg:justify-center lg:h-full lg:items-center lg:gap-4"
        id="containerSteps"
      >
        <div class="lg:w-sm text-5xl text-gray-400 text-center" id="titleStep">
          <div class="flex flex-col items-center gap-10 justify-center"></div>
        </div>

        <form class="w-full py-12 lg:w-xl lg:mb-0 lg:py-0"></form>
      </div>
      <div
        class="fixed right-0 w-full left-0 bottom-0 flex justify-center lg:justify-end gap-4 py-4 px-0 lg:px-12 bg-gray-200"
      >
        <button
          type="button"
          class="nextBtnStep bg-cyan-900 text-white px-12 py-2 rounded-3xl cursor-pointer"
        >
          Continuar
        </button>
      </div>
    </main>

    <script type="module">
      import { createDatabase } from "./src/scripts/database.js";
      const CONTAINERSTEPS = document.querySelector("#containerSteps");
      const titleStep = document.querySelector("#titleStep");
      const form = document.querySelector("form");
      const nextBtnStep = document.querySelector(".nextBtnStep");

      let step = Number(localStorage.getItem("step")) || 0;

      const business = {
        user: {},
        businessInformation: [],
        listProducts: [],
        config: [],
      };

      const steps = [
        {
          title: "Cuenta.",
          formInformation: [
            {
              value: "Nombres",
              name: "userFirstNames",
              placeholder: "Necesario para el inicio de session.",
              type: "text",
            },
            {
              value: "Apellidos",
              name: "userLastNames",
              placeholder: "Necesario para el inicio de session.",
              type: "text",
            },
            {
              value: "Correo de contacto",
              name: "userEmail",
              placeholder: "example@gmail.com",
              type: "text",
            },
            {
              value: "Contaseña",
              name: "userCredHas",
              placeholder: "* * * * * * * *",
              type: "password",
            },
            {
              value: "Repetir Contaseña",
              name: "repetUserCredHas",
              placeholder: "* * * * * * * *",
              type: "password",
            },
          ],
          urlImage: "public/register.png",
        },
        {
          title: "Negocio.",
          formInformation: [
            {
              value: "Tipo de negocio",
              name: "businessType",
              type: "radio",
              options: [
                "Minimarket",
                "Botillería",
                "Tiendas de ventas (varios)",
                "Petshop",
              ],
            },
            {
              value: "Nombre del Negocio",
              name: "businessName",
              placeholder: "Ejemplo: 'ventamax'",
              type: "text",
            },
            {
              value: "Numero trabadores",
              name: "businessCountPersonal",
              placeholder: "1 al 20.",
              type: "text",
            },
            {
              value: "Administrador del inventario",
              name: "businessAdmin",
              placeholder: "Podra administrar el inventario.",
              type: "text",
            },
          ],
          urlImage: "public/privacy-policy.png",
        },
        {
          title: "Inventario",
          formInformation: [
            {
              value: "Categoria",
              name: "category",
              placeholder: "Liquidos, Panaderia, etc..",
              type: "text",
            },
            {
              value: "Nombre del producto",
              name: "nameProduct",
              placeholder: "Jugo whatts 2ltrs",
              type: "text",
            },
            {
              value: "Cantidad",
              name: "count",
              placeholder: "1-50",
              type: "text",
            },
          ],
          urlImage: "public/to-do-list.png",
        },
        {
          title: "Configuracion",
          formInformation: [
            {
              value: "Alerta de stock",
              name: "alertStock",
              placeholder:
                "Activa una alerta al tener un producto con stock bajo.",
              type: "checkbox",
            },
          ],
          urlImage: "public/to-do-list.png",
        },
      ];

      document.addEventListener("DOMContentLoaded", (e) => {
        const values = [];

        nextBtnStep.addEventListener("click", (e) => {
          form.addEventListener("submit", (e) => e.preventDefault());

          let error = false;
          let value = {};

          document
            .querySelectorAll("[data-selector='true']")
            .forEach((INPUT) => {
              if (INPUT.value === "" || INPUT.value.length === 0) {
                error = true;
              } else {
                value = {
                  ...value,
                  [INPUT.name]: INPUT.value,
                };
              }
            });

          if (error) {
            createModal({
              title: "Error!",
              text: "Los campos (*) son obligatorios!",
            });
            return;
          }

          const listKeys = [
            "user",
            "businessInformation",
            "listProducts",
            "config",
          ];

          business[listKeys[step]] = value;

          business.user = {
            ...business.user,
            role: "admin",
            createdAdd: [
              new Date().getDate(),
              new Date().getMonth() + 1,
              new Date().getFullYear(),
            ].join("/"),
          };

          step++;
          localStorage.setItem("step", step);

          if (step >= listKeys.length) {
            createDatabase("business", business);
            window.location.href = "test.html";
          } else {
            updateUI(steps[step]);
          }
        });
      });

      const renderFormSteps = (input) => {
        const formControl = document.createElement("div");
        formControl.classList.add(
          "flex",
          "flex-col",
          "mb-4",
          "gap-3",
          "relative",
        );

        formControl.innerHTML +=
          input.type !== "radio"
            ? `
            <label for="${input.name}" class="text-lg text-gray-400">
              ${input.value} <span class="text-gray-900">(*)</span>
            </label>
            <input 
              type="${input.type}"
              class="border border-gray-500 py-3 rounded-lg ps-4 focus:placeholder:text-gray-900 ${input.name === `businessAdmin` ? "pointer-events-none bg-gray-800/10" : ""}"
              placeholder="${input.placeholder}"
              name="${input.name}"
              data-selector="true"
              ${input.name === `businessAdmin` ? `value="${business.user.userFirstNames}"` : ""}
            />
              ${
                input.type === `password`
                  ? `
                  <div class="absolute inset-0 flex justify-end items-end pointer-events-none">
                    <button type="button" class="p-4 py-3 border-s border-gray-400 pointer-events-auto text-gray-400 active:text-gray-900">
                      <i class="fa-regular fa-eye-slash" data-id="revealPass"></i>
                    </button>
                  </div>
                `
                  : ""
              }
            `
            : `
            <h5>
              Seleccione la categoria.
            </h5>
            
              ${input.options
                .map(
                  (option) => `
                  <label class="text-lg text-gray-400" name="${input.type}">
                    <input
                      type="radio"
                      class="border border-gray-500 py-3 rounded-lg ps-4 text-gray-400 focus:text-gray-900"
                      for="${input.type}" 
                      data-selector="true" 
                      name="${input.name}"
                      value="${option}"
                    >
                    <span>${option}</span>
                  </label>
                `,
                )
                .join("")}
          
            `;

        formControl.addEventListener("click", (e) => {
          if (e.target.dataset.id === "revealPass") {
            const isChange = e.target.classList.toggle("text-gray-900");

            e.target.setAttribute(
              "class",
              isChange
                ? "fa-regular fa-eye text-gray-900"
                : "fa-regular fa-eye-slash",
            );

            formControl
              .querySelector("input")
              .setAttribute("type", isChange ? "text" : "password");
          }
        });

        return formControl;
      };

      const updateUI = (step) => {
        titleStep.innerHTML = `
          <div class="flex flex-col items-center gap-10 justify-center">
            <h5>${step.title}</h5>
            <img src=${step.urlImage} alt="${step.title}" class="opacity-30 w-40 h-40 lg:w-full lg:h-auto">
          </div>
        `;

        form
          .querySelectorAll("div.flex.flex-col.mb-4.gap-3")
          .forEach((input) => input.remove());
        form.classList.add("flex", "flex-col", "justify-center");

        step.formInformation.forEach((formInput) => {
          form.appendChild(renderFormSteps(formInput));
        });

        CONTAINERSTEPS.classList.add("animate-transition");

        setTimeout(() => {
          CONTAINERSTEPS.classList.remove("animate-transition");
        }, 4000);
      };

      updateUI(steps[step]);

      const createModal = ({ title, text }) => {
        const modal = document.createElement("div");
        modal.innerHTML = `
        <div class="fixed inset-0 flex justify-center items-center bg-gray-900/60">
          <div class="flex flex-col w-sm bg-white rounded-xl">
            <div class="flex justify-between border-b border-gray-400 px-4 py-3">
              <h5 class="text-red-600">
                <i class="fa-solid fa-circle-exclamation"></i>
                ${title}
              </h5>
              <button data-selector="btnCloseModal" class="cursor-pointer text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-x"></i>
              </button>
            </div>
            <div class="text-gray-800 px-4 py-3">
              <span>${text}</span>
            </div>
          </div>

        </div>
        `;

        modal
          .querySelector('[data-selector="btnCloseModal"]')
          .addEventListener("click", () => {
            modal.remove();
          });

        document.body.appendChild(modal);
      };
    </script>
  </body>
</html>
