<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de inventario / Crea tu inventario</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50">
    <div
      class="max-w-xl m-auto h-screen flex justify-center items-center"
      id="containerSteps"
    ></div>

    <script>
      const CONTAINERSTEPS = document.querySelector("#containerSteps");
      const CURRENTSTEP = document.createElement("div");
      const TITLESTEP = document.createElement("h5");
      const childStape = document.createElement("form");
      const buttonSubmit = document.createElement("button");

      let currentStep = Number(localStorage.getItem("currentStep")) || 0;

      CURRENTSTEP.classList.add("bg-white", "rounded-lg", "p-8", "shadow-lg");
      TITLESTEP.classList.add(
        "text-5xl",
        "text-gray-700",
        "text-center",
        "block",
        "mb-10",
      );

      childStape.classList.add(
        "flex",
        "flex-col",
        "gap-6",
        "max-w-xl",
        "mx-auto",
      );

      buttonSubmit.textContent = "Continuar";
      buttonSubmit.type = "submit";
      buttonSubmit.classList.add(
        "border-4",
        "border-cyan-900",
        "py-2",
        "rounded-xl",
        "text-xl",
        "font-bold",
        "text-gray-600",
        "cursor-pointer",
      );

      const steps = [
        {
          titleStep: "Ingresa tu informacion",
          formInformation: [
            {
              value: "Tipo de negocio",
              name: "typeBusiness",
              placeholder: "Minimarket, Botilleria, Etc...",
              type: "select",
              options: [
                "Almacén",
                "Minimarket",
                "Botillería",
                "Tiendas de ventas (varios)",
                "Petshop",
                "Locales de comida",
              ],
            },
            {
              value: "Numero trabadores",
              name: "personal",
              placeholder: "1 al 20.",
              type: "text",
            },
            {
              value: "Cantidad de productos",
              name: "countProducts",
              placeholder: "Maximo 100",
              type: "text",
            },
            {
              value: "Administrador del inventario",
              name: "adminDatabase",
              placeholder: "Podra administrar el inventario.",
              type: "text",
            },
            {
              value: "Defina la contrsaña.",
              name: "credentialAdmin",
              placeholder: "password",
              type: "password",
            },
          ],
        },
        {
          titleStep: "Ingresa el o los productos.",
          formInformation: [
            {
              value: "Categoria",
              name: "category",
              placeholder: "Liquidos, Verduras, Panaderia.",
              type: "text",
            },
            {
              value: "Nombre del producto",
              name: "nameProduct",
              placeholder: "Jugo whatts 2ltrs",
              type: "text",
            },
            {
              value: "Cantidad",
              name: "count",
              placeholder: "1-50",
              type: "text",
            },
          ],
        },
        {
          titleStep: "Configura tu vista.",
          formInformation: [
            {
              value: "Alerta de stock",
              name: "alertStock",
              placeholder:
                "Activa una alerta al tener un producto con stock bajo.",
              type: "checkbox",
            },
          ],
        },
      ];

      document.addEventListener("DOMContentLoaded", (e) => {
        const values = [];

        document.querySelector("form").addEventListener("submit", (e) => {
          e.preventDefault();
          let error = false;
          let value = {}


          const business = JSON.parse(localStorage.getItem('business')) || {
            businessInformation: [],
            listProducts: [],
            config: [],
          } ;

          document.querySelectorAll("input").forEach((INPUT) => {
            if (INPUT.value === "" || INPUT.value.length === 0) {
              error = true;
            } else {
              value = {
                ...value,
                [INPUT.name]:INPUT.value
              };
            }
          });

          if (error) {
            createModal({
              title: "Error!",
              text: "Los campos (*) son obligatorios!",
            });
            return;
          }



          if (currentStep === 0) {
            business.businessInformation = value
          } else if (currentStep === 1) {
            business.listProducts = value;
          } else if (currentStep === 2) {
            business.config = value;
            window.location.href = 'test.html'
          }

          currentStep++;
          localStorage.setItem("currentStep", currentStep);
          localStorage.setItem("business", JSON.stringify(business));

          updateUI();
        });
      });

      const renderFormSteps = (form) => {
        childStape.innerHTML = `
          ${form
            .map(
              (input) => `
                <div class="flex flex-col gap-3">
                  <label for="${input.name}" class="text-lg text-gray-400">
                    ${input.value} (*)
                  </label>
                  <input 
                    type="${input.type}"
                    class="w-full border border-gray-500 py-3 rounded-lg ps-4"
                    placeholder="${input.placeholder}"
                    name="${input.name}"
                    data-selector="true"
                  />
                </div>
              `,
            )
            .join("")}
        `;

        childStape.appendChild(buttonSubmit);

        return childStape;
      };

      const updateUI = () => {
        TITLESTEP.textContent = steps[currentStep].titleStep;
        CURRENTSTEP.appendChild(TITLESTEP);
        CURRENTSTEP.appendChild(
          renderFormSteps(steps[currentStep].formInformation),
        );
      };

      const createModal = ({ title, text }) => {
        const modal = document.createElement("div");
        modal.innerHTML = `
        <div class="fixed inset-0 flex justify-center items-center bg-gray-900/60">
          <div class="flex flex-col w-xl p-6 bg-white gap-8 rounded-xl">
            <div class="flex justify-between">
              <h5 class="text-3xl text-gray-400"><i class="fa-solid fa-circle-exclamation"></i></h5>
              <button data-selector="btnCloseModal" class="cursor-pointer text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-x"></i>
              </button>
            </div>
            <div>
              <span>${text}</span>
            </div>
          </div>

        </div>
        `;

        modal
          .querySelector('[data-selector="btnCloseModal"]')
          .addEventListener("click", () => {
            modal.remove();
          });

        document.body.appendChild(modal);
      };
      updateUI();

      CONTAINERSTEPS.appendChild(CURRENTSTEP);
    </script>
  </body>
</html>
