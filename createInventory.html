<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de inventario / Crea tu inventario</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50">
    <nav class="text-white lg:absolute w-full border-b border-gray-300">
      <div class="container mx-auto px-4 lg:px-0">
        <div
          class="flex justify-between items-center py-6 relative z-10 relative"
        >
          <a href="#" class="text-4xl/7 font-bold text-cyan-900"> Inventory </a>

          <div
            class="absolute top-full left-0 right-0 bg-cyan-900 z-20 hidden lg:static lg:z-10 lg:inset-[initial] lg:block lg:bg-transparent"
            id="toggle-menu"
          >
            <ul class="flex flex-col gap-8 text-xl lg:flex-row">
              <li>
                <a href="#aboutUs" class="text-gray-600 hover:text-gray-50">
                  Inicio
                </a>
              </li>
              <li>
                <a href="#aboutUs" class="text-gray-600 hover:text-gray-50">
                  Sobre Nosotros
                </a>
              </li>
              <li>
                <a href="#aboutUs" class="text-gray-600 hover:text-gray-50">
                  Informacion
                </a>
              </li>
              <li>
                <a href="#aboutUs" class="text-gray-600 hover:text-gray-50">
                  Preguntas frecuentes
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <div
      class="min-h-screen max-w-6xl flex items-center justify-center mx-auto"
      id="containerSteps"
    ></div>

    <script>
      const CONTAINERSTEPS = document.querySelector("#containerSteps");
      const CURRENTSTEP = document.createElement("div");
      const TITLESTEP = document.createElement("div");
      const childStape = document.createElement("form");
      const footerForm = document.createElement("div");

      let currentStep = Number(localStorage.getItem("currentStep")) || 0;

      TITLESTEP.classList.add(
        "lg:w-xl",
        "text-5xl",
        "text-gray-400",
        "text-center",
        "block",
      );

      CURRENTSTEP.classList.add(
        "rounded-lg",
        "px-8",
        "py-8",
        "pb-12",
        "mb-12",
        "flex",
        "flex-col",
        "gap-6",
        "lg:flex-row",
      );

      childStape.classList.add(
        "flex",
        "flex-col",
        "gap-6",
        "lg:w-2xl",
        "justify-center",
      );

      footerForm.classList.add(
        "fixed",
        "right-0",
        "w-full",
        "left-0",
        "bottom-0",
        "flex",
        "justify-center",
        "lg:justify-end",
        "gap-4",
        "py-4",
        "px-0",
        "lg:px-12",
        "bg-gray-200",
      );

      const steps = [
        {
          titleStep: "Informacion Personal",
          formInformation: [
            {
              value: "Tipo de negocio",
              name: "typeBusiness",
              placeholder: "Minimarket, Botilleria, Etc...",
              type: "select",
              options: [
                "Almacén",
                "Minimarket",
                "Botillería",
                "Tiendas de ventas (varios)",
                "Petshop",
                "Locales de comida",
              ],
            },
            {
              value: "Numero trabadores",
              name: "personal",
              placeholder: "1 al 20.",
              type: "text",
            },
            {
              value: "Administrador del inventario",
              name: "adminDatabase",
              placeholder: "Podra administrar el inventario.",
              type: "text",
            },
            {
              value: "Defina la contrsaña.",
              name: "credentialAdmin",
              placeholder: "password",
              type: "password",
            },
          ],
          urlImage: "public/privacy-policy.png",
        },
        {
          titleStep: "Ingresa el o los productos.",
          formInformation: [
            {
              value: "Categoria",
              name: "category",
              placeholder: "Liquidos, Verduras, Panaderia.",
              type: "text",
            },
            {
              value: "Nombre del producto",
              name: "nameProduct",
              placeholder: "Jugo whatts 2ltrs",
              type: "text",
            },
            {
              value: "Cantidad",
              name: "count",
              placeholder: "1-50",
              type: "text",
            },
          ],
          urlImage: "public/to-do-list.png",
        },
        {
          titleStep: "Configura tu vista.",
          formInformation: [
            {
              value: "Alerta de stock",
              name: "alertStock",
              placeholder:
                "Activa una alerta al tener un producto con stock bajo.",
              type: "checkbox",
            },
          ],
          urlImage: "public/to-do-list.png",
        },
      ];

      document.addEventListener("DOMContentLoaded", (e) => {
        const values = [];

        document.querySelector("form").addEventListener("submit", (e) => {
          e.preventDefault();
          let error = false;
          let value = {};

          const business = JSON.parse(localStorage.getItem("business")) || {
            businessInformation: [],
            listProducts: [],
            config: [],
          };

          document
            .querySelectorAll("[data-selector='true']")
            .forEach((INPUT) => {
              if (INPUT.value === "" || INPUT.value.length === 0) {
                error = true;
              } else {
                value = {
                  ...value,
                  [INPUT.name]: INPUT.value,
                };
              }
            });

          if (error) {
            createModal({
              title: "Error!",
              text: "Los campos (*) son obligatorios!",
            });
            return;
          }

          if (currentStep === 0) {
            business.businessInformation = value;
            CURRENTSTEP.classList.add("flex-row-reverse");
          } else if (currentStep === 1) {
            console.log("paso por aqui");
            business.listProducts = value;
          } else if (currentStep === 2) {
            business.config = value;
            window.location.href = "test.html";
          }

          currentStep++;
          localStorage.setItem("currentStep", currentStep);
          localStorage.setItem("business", JSON.stringify(business));

          updateUI();
        });
      });

      const renderFormSteps = (form) => {
        childStape.innerHTML = `
          ${form
            .map((input) =>
              input.type !== "select"
                ? `
                <div class="flex flex-col gap-3">
                  <label for="${input.name}" class="text-lg text-gray-400">
                    ${input.value} <span class="text-gray-900">(*)</span>
                  </label>
                  <input 
                    type="${input.type}"
                    class="border border-gray-500 py-3 rounded-lg ps-4 focus:placeholder:text-gray-900"
                    placeholder="${input.placeholder}"
                    name="${input.name}"
                    data-selector="true"
                  />
                </div>
              `
                : `
                <div class="flex flex-col gap-3">
                  <label class="text-lg text-gray-400">
                    ${input.value} <span class="text-gray-900">(*)</span>
                  </label>
                  <select 
                    class="border border-gray-500 py-3 rounded-lg ps-4 text-gray-400 focus:text-gray-900"
                    for="${input.name}" 
                    data-selector="true" 
                    name="${input.name}"
                  >
                    <option value="">-- Selecciona un tipo de negocio --</option>
                    ${input.options.map((option) => `<option value="${option}">${option}</option>`)}
                  </select>
                </div>
              `,
            )
            .join("")}
        `;

        footerForm.innerHTML = `
          <button type="button" class="bg-white text-cyan-900 border-2 border-cyan-900 px-12 py-3 rounded-3xl cursor-pointer">
            Cancelar
          </button>      
          <button type="submit" class="bg-cyan-900 text-white px-12 py-3 rounded-3xl cursor-pointer">
            Continuar
          </button>
        `;

        childStape.appendChild(footerForm);

        return childStape;
      };

      const updateUI = () => {
        TITLESTEP.innerHTML = `
          <div class="flex flex-col items-center gap-10 h-full justify-center">
            <h5>${steps[currentStep].titleStep}</h5>
            <img src=${steps[currentStep].urlImage} alt="" class="opacity-7 w-80 h-80 mx-auto">
          </div>
        `;
        CURRENTSTEP.appendChild(TITLESTEP);
        CURRENTSTEP.appendChild(
          renderFormSteps(steps[currentStep].formInformation),
        );
      };

      const createModal = ({ title, text }) => {
        const modal = document.createElement("div");
        modal.innerHTML = `
        <div class="fixed inset-0 flex justify-center items-center bg-gray-900/60">
          <div class="flex flex-col w-sm bg-white rounded-xl">
            <div class="flex justify-between border-b border-gray-400 px-4 py-3">
              <h5 class="text-red-600">
                <i class="fa-solid fa-circle-exclamation"></i>
                ${title}
              </h5>
              <button data-selector="btnCloseModal" class="cursor-pointer text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-x"></i>
              </button>
            </div>
            <div class="text-gray-800 px-4 py-3">
              <span>${text}</span>
            </div>
          </div>

        </div>
        `;

        modal
          .querySelector('[data-selector="btnCloseModal"]')
          .addEventListener("click", () => {
            modal.remove();
          });

        document.body.appendChild(modal);
      };
      updateUI();

      CONTAINERSTEPS.appendChild(CURRENTSTEP);
    </script>
  </body>
</html>
